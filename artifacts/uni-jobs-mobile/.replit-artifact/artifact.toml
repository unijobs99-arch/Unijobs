kind = "mobile"
previewPath = "/"
title = "UniJobs"
version = "1.0.0"
id = "artifacts/uni-jobs-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 25279

[services.development]
run = "pnpm --filter @workspace/uni-jobs-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/uni-jobs-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/uni-jobs-mobile", "run", "serve" ]

[services.env]
PORT = "25279"
BASE_PATH = "/"
