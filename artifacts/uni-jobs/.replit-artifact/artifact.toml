kind = "web"
previewPath = "/uni-jobs/"
title = "UniJobs"
version = "1.0.0"
id = "artifacts/uni-jobs"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/uni-jobs/" ]
localPort = 25541

[services.development]
run = "pnpm --filter @workspace/uni-jobs run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/uni-jobs", "run", "build" ]
publicDir = "artifacts/uni-jobs/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25541"
BASE_PATH = "/uni-jobs/"
